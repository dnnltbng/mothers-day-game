<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mom's Morning Rush</title>
    <style>
        body { font-family: 'Comic Sans MS', sans-serif; text-align: center; background: #fff0f5; padding: 20px; }
        
        #game-container {
            position: relative;
            display: inline-block;
            border: 10px solid #ff69b4;
            border-radius: 20px;
            overflow: hidden;
            background-color: white;
            line-height: 0;
        }

        /* The Background Room */
        #room-bg {
            width: 100%;
            max-width: 800px;
            height: auto;
            display: block;
        }

        /* The Hidden Items */
        .item {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.2s;
            /* DEBUG BORDER: Remove the next line once you're happy! */
            outline: 2px solid red; 
        }

        .item:hover { transform: scale(1.3); }

        /* Adjusting positions so they sit on furniture */
        #keys { top: 75%; left: 15%; width: 50px; }
        #phone { top: 45%; left: 75%; width: 40px; }
        #umbrella { top: 25%; left: 5%; width: 80px; }
        #card { top: 60%; left: 45%; width: 50px; }

        #checklist { margin-top: 20px; font-size: 22px; }
        .found { text-decoration: line-through; color: #ff69b4; opacity: 0.3; }
        .win-banner { display: none; font-size: 30px; color: #ff1493; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>🏃‍♀️ Mom is late! Find her 4 things!</h1>

    <div id="game-container">
        <!-- Stable Background Image -->
        <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&q=80&w=800" id="room-bg">

        <!-- Hidden Items (Using stable Flaticon-style links) -->
        <img src="https://cdn-icons-png.flaticon.com/512/658/658145.png" id="keys" class="item" onclick="collect('keys')">
        <img src="https://cdn-icons-png.flaticon.com/512/0/191.png" id="phone" class="item" onclick="collect('phone')">
        <img src="https://cdn-icons-png.flaticon.com/512/3050/3050085.png" id="umbrella" class="item" onclick="collect('umbrella')">
        <img src="https://cdn-icons-png.flaticon.com/512/12104/12104331.png" id="card" class="item" onclick="collect('card')">
    </div>

    <div id="checklist">
        <span id="label-keys">🔑 Keys</span> | 
        <span id="label-phone">📱 Smartphone</span> | 
        <span id="label-umbrella">☂️ Umbrella</span> | 
        <span id="label-card">💳 EasyCard</span>
    </div>

    <div id="win-banner" class="win-banner">💖 MOM IS READY! YOU WIN! 💖</div>

    <script>
        let foundItems = 0;

        function collect(id) {
            const element = document.getElementById(id);
            const label = document.getElementById('label-' + id);

            if (element.style.visibility !== 'hidden') {
                element.style.visibility = 'hidden'; // Hide the item
                label.classList.add('found'); // Cross it off the list
                foundItems++;

                if (foundItems === 4) {
                    document.getElementById('win-banner').style.display = 'block';
                    alert("Awesome! Now Mom won't be late for school!");
                }
            }
        }
    </script>
</body>
</html>
