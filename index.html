<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mom's Morning Rush</title>
    <style>
        body { font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; text-align: center; background: #fff9c4; padding: 20px; color: #5d4037; }
        
        #game-container {
            position: relative;
            display: inline-block;
            border: 8px solid #ff9800;
            border-radius: 25px;
            overflow: hidden;
            background-color: white;
            line-height: 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Bright, Colorful Living Room */
        #room-bg {
            width: 100%;
            max-width: 800px;
            height: auto;
            display: block;
        }

        /* Hidden Items - No borders this time! */
        .item {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.2s;
            opacity: 0.9; /* Slightly transparent to blend in */
        }

        .item:hover { transform: scale(1.2); opacity: 1; }

        /* Placements for the Living Room */
        #keys { top: 82%; left: 12%; width: 35px; }       /* Near the rug/floor */
        #phone { top: 58%; left: 78%; width: 30px; }      /* On the sofa/side table */
        #umbrella { top: 35%; left: 5%; width: 70px; }     /* Leaning against the wall */
        #card { top: 65%; left: 42%; width: 45px; }       /* On the coffee table area */

        #checklist { margin-top: 25px; font-size: 24px; background: white; display: inline-block; padding: 10px 30px; border-radius: 50px; }
        .found { text-decoration: line-through; color: #bdbdbd; opacity: 0.5; }
        .win-banner { display: none; font-size: 35px; color: #e91e63; font-weight: bold; margin-top: 20px; animation: pop 0.5s infinite alternate; }

        @keyframes pop {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <h1>🌸 Mom's Morning Rush 🌸</h1>
    <p style="font-size: 18px;">Find Mom's things before she leaves for work!</p>

    <div id="game-container">
        <!-- Colorful Living Room Background -->
        <img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&q=80&w=800" id="room-bg">

        <!-- Hidden Items -->
        <img src="https://cdn-icons-png.flaticon.com/512/658/658145.png" id="keys" class="item" onclick="collect('keys')">
        <img src="https://cdn-icons-png.flaticon.com/512/0/191.png" id="phone" class="item" onclick="collect('phone')">
        <img src="https://cdn-icons-png.flaticon.com/512/3050/3050085.png" id="umbrella" class="item" onclick="collect('umbrella')">
        <img src="https://cdn-icons-png.flaticon.com/512/12104/12104331.png" id="card" class="item" onclick="collect('card')">
    </div>

    <br>

    <div id="checklist">
        <span id="label-keys">🔑 Keys</span> &nbsp; | &nbsp;
        <span id="label-phone">📱 Smartphone</span> &nbsp; | &nbsp;
        <span id="label-umbrella">☂️ Umbrella</span> &nbsp; | &nbsp;
        <span id="label-card">💳 EasyCard</span>
    </div>

    <div id="win-banner" class="win-banner">✨ YOU SAVED THE DAY! ✨</div>

    <script>
        let foundItems = 0;

        function collect(id) {
            const element = document.getElementById(id);
            const label = document.getElementById('label-' + id);

            if (element.style.visibility !== 'hidden') {
                element.style.visibility = 'hidden'; 
                label.classList.add('found'); 
                foundItems++;

                if (foundItems === 4) {
                    document.getElementById('win-banner').style.display = 'block';
                    // Delay the alert so they see the win banner first
                    setTimeout(() => {
                        alert("Great job! Mom is ready to go!");
                    }, 500);
                }
            }
        }
    </script>
</body>
</html>
